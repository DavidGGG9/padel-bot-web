[project]
name = "padelbot-web"
version = "0.1.0"
description = "WEB UI for padelbot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pre-commit>=4.6.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.17.0",
]

[project.scripts]
workspace = "workspace:main"

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
