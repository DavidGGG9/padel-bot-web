<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelBot - Disponibilités des terrains à la Réunion</title>
<style>
  :root {
    --bg: #F4F6F5;
    --surface: #FFFFFF;
    --ink: #14201E;
    --muted: #5B6D68;
    --primary: #0E4B44;
    --primary-ink: #FFFFFF;
    --accent: #CFE94A;
    --accent-ink: #33420A;
    --border: #DCE3E0;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.4;
  }
  header {
    position: relative;
    background: var(--primary);
    color: var(--primary-ink);
    padding: 20px 16px 44px;
  }
  .beta-badge {
    position: absolute;
    bottom: 12px;
    right: 16px;
    display: flex;
    flex-direction: row;
    align-items: baseline;
    gap: 6px;
    text-align: right;
    font-size: 11px;
    line-height: 1.2;
    color: rgba(255,255,255,0.82);
  }
  .beta-badge strong {
    color: var(--accent);
    font-size: 12px;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  header .updated {
    margin: 0;
    font-size: 13.5px;
    color: rgba(255,255,255,0.72);
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px 48px;
  }
  .view-tabs {
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: fixed;
    left: 16px;
    top: 96px;
    width: 210px;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    z-index: 5;
  }
  .view-tab {
    width: 100%;
    border: 1px solid var(--border);
    background: #F8FAF9;
    color: var(--muted);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .view-tab.active {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--primary-ink);
  }
  .panel { margin-top: 10px; }
  .panel.hidden { display: none; }
  .filters {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .filters input, .filters select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    color: var(--ink);
    background: var(--surface);
  }
  .ms { position: relative; }
  .ms summary {
    list-style: none;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: var(--surface);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ms summary::-webkit-details-marker { display: none; }
  .ms-options {
    position: absolute;
    left: 0; right: 0;
    top: calc(100% + 4px);
    max-height: 260px;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
    z-index: 10;
  }
  .ms-options label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    font-size: 14px;
    cursor: pointer;
  }
  .ms-options input { width: auto; }
  .filters .reset {
    grid-column: 1 / -1;
    text-align: right;
    font-size: 13px;
    color: var(--primary);
    background: none;
    border: none;
    padding: 4px 0 0;
    cursor: pointer;
    text-decoration: underline;
  }
  .day-tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 16px 0 4px;
    scrollbar-width: none;
  }
  .day-tabs::-webkit-scrollbar { display: none; }
  .day-tab {
    flex: 0 0 auto;
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .day-tab.active {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--primary-ink);
  }
  .summary {
    font-size: 13px;
    color: var(--muted);
    margin: 12px 2px 8px;
  }
  .slot {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .slot .time {
    flex: 0 0 92px;
    font-weight: 700;
    font-size: 14.5px;
    color: var(--primary);
  }
  .slot .time small {
    display: block;
    font-weight: 500;
    color: var(--muted);
    font-size: 11.5px;
  }
  .slot .info { flex: 1; min-width: 0; }
  .slot .club {
    font-weight: 600;
    font-size: 14.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .slot .place {
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .slot .weather { flex: 0 0 auto; width: 32px; height: 32px; }
  .slot .weather img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .slot .badge {
    flex: 0 0 auto;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 11.5px;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 20px;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 40px 12px;
  }
  footer {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px 32px;
    text-align: center;
    font-size: 12.5px;
  }
  footer a { color: var(--muted); }
  .fresh-summary {
    font-size: 13px;
    color: var(--muted);
    margin: 14px 2px 8px;
  }
  .club-status {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .club-status .club-name {
    font-size: 14.5px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .club-status .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .club-status .btn {
    flex: 1 1 150px;
    text-align: center;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
  }
  .club-status .btn.disabled {
    background: #EEF1F0;
    color: var(--muted);
    cursor: default;
  }
  .club-status .btn.primary {
    background: #2A8296;
    color: #fff;
    border-color: #2A8296;
  }
  .club-status .btn:not(.primary):not(.disabled) {
    color: #2A8296;
    border-color: #2A8296;
  }
  @media (max-width: 1024px) {
    .view-tabs {
      position: sticky;
      top: 0;
      width: auto;
      flex-direction: row;
      margin-top: 16px;
    }
    .view-tab { width: auto; flex: 1; }
  }
</style>
</head>
<body>

<header>
  <h1>PadelBot - Trouvez un terrain à la Réunion</h1>
  <p class="updated" id="updated"></p>
  <div class="beta-badge">
    <strong id="version">Version</strong>
  </div>
</header>

<main>
  <div class="view-tabs">
    <button class="view-tab active" id="tab-availabilities" type="button">Disponibilités</button>
    <button class="view-tab" id="tab-freshness" type="button">Réserver</button>
  </div>

  <section class="panel" id="panel-availabilities">
    <div class="filters">
      <details class="ms" id="filter-city"><summary>Toutes les villes</summary><div class="ms-options"></div></details>
      <details class="ms" id="filter-club"><summary>Tous les clubs</summary><div class="ms-options"></div></details>
      <details class="ms" id="filter-time"><summary>Toutes les heures</summary><div class="ms-options"></div></details>
      <details class="ms" id="filter-duration"><summary>Toutes les durées</summary><div class="ms-options"></div></details>
      <button class="reset" id="reset">Réinitialiser les filtres</button>
    </div>

    <div class="day-tabs" id="day-tabs"></div>
    <p class="summary" id="summary"></p>
    <div id="slot-list"></div>
  </section>

  <section class="panel hidden" id="panel-freshness">
    <p class="fresh-summary" id="fresh-summary"></p>
    <div id="fresh-list"></div>
  </section>
</main>

<footer>
  <a href="./mentions-legales.html">Mentions légales</a>
</footer>

<script>
fetch('VERSION')
  .then(r => r.ok ? r.text() : Promise.reject())
  .then(v => { document.getElementById('version').textContent = `Version ${v.trim()}`; })
  .catch(() => {});
  const DATA_URL = './availabilities.json';
  const SCRAPE_RUNS_URL = './scrape_runs.json';
  const METEO_URL = './meteo_runs.json';
  const WEATHER_ICONS = {
    'nuageux': 'cloudy.png',
    'ensoleillé': 'sunny.png',
    'nuit sans pluie': 'night-clear.png',
    'pluvieux': 'rainy.png',
  };
  let meteoByClubHour = new Map();
  const REUNION_TIME_ZONE = 'Indian/Reunion';
  const reunionDateFormatter = new Intl.DateTimeFormat('en-CA', {
    timeZone: REUNION_TIME_ZONE,
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
  });
  let allSlots = [];
  let scrapeRuns = [];
  let failedScrapes = new Set();
  let days = [];
  const DURATION_BUCKETS = [
    { id: '30', label: '30 min', match: d => d === 30 },
    { id: '60', label: '1h et +', match: d => d >= 60 },
    { id: '120', label: '2h et +', match: d => d >= 120 },
  ];
  const TIME_BUCKETS = [
    { id: 'morning', label: 'Matin', match: h => h < 12 },
    { id: 'afternoon', label: 'Après-midi', match: h => h >= 12 && h < 18 },
    { id: 'evening', label: 'Soir', match: h => h >= 18 },
  ];
  const slotHour = s => Number(/T(\d\d)/.exec(s.start)[1]);
  const DEFAULT_DURATIONS = ['60', '120'];
  let state = { city: [], club: [], durations: [...DEFAULT_DURATIONS], times: [], day: null, view: 'availabilities' };

  function buildMeteoIndex(runs) {
    meteoByClubHour = new Map(runs.map(r =>
      [`${r.club}|${new Date(r.localDatetime).getTime()}`, r.flag]));
  }

  // localDatetime is the END of the forecast hour: a slot starting 08:00 or 08:30 uses the 09:00 entry.
  // Slot starts have no UTC offset and are Réunion local time (UTC+4).
  function weatherFor(slot) {
    const HOUR = 3600000;
    const start = /[zZ]|[+-]\d\d:?\d\d$/.test(slot.start) ? slot.start : `${slot.start}+04:00`;
    const end = (Math.floor(new Date(start).getTime() / HOUR) + 1) * HOUR;
    const flag = meteoByClubHour.get(`${slot.club}|${end}`);
    const file = WEATHER_ICONS[flag];
    return file ? { flag, src: `./images/${file}` } : null;
  }

  function fmtTime(iso) {
    const d = new Date(iso);
    return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }

  function fmtEndTime(iso, durationMinutes) {
    const d = new Date(new Date(iso).getTime() + durationMinutes * 60000);
    return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }

  function fmtDuration(mins) {
    if (mins % 60 === 0) return (mins / 60) + 'h';
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return h > 0 ? `${h}h${String(m).padStart(2, '0')}` : `${m} min`;
  }

  function fmtCourtName(court) {
    return String(court || '')
      .replace(/\bterrain\b/gi, '')
      .replace(/\s{2,}/g, ' ')
      .trim();
  }

  function dayKey(iso) {
    return new Date(iso).toISOString().slice(0, 10);
  }

  function fmtDayLabel(key) {
    const d = new Date(key + 'T12:00:00');
    const today = new Date();
    const todayKey = today.toISOString().slice(0, 10);
    const tomorrow = new Date(today.getTime() + 86400000).toISOString().slice(0, 10);
    if (key === todayKey) return "Aujourd'hui";
    if (key === tomorrow) return 'Demain';
    return d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
  }

  function uniqueSorted(values) {
    return [...new Set(values)].sort((a, b) => a.localeCompare(b));
  }

  function reunionDateKey(date = new Date()) {
    return reunionDateFormatter.format(date);
  }

  function fmtUpdatedSubtitle(d) {
    const datePart = d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    const timePart = d.toLocaleTimeString('fr-FR', {
      hour: '2-digit',
      minute: '2-digit',
      hour12: false,
    });
    return `Mis à jour le ${datePart} à ${timePart}`;
  }

  function getAllCities() {
    return uniqueSorted(allSlots.map(s => s.city));
  }

  function getAllClubs() {
    return uniqueSorted(allSlots.map(s => s.club));
  }

  function getClubsForCities(cities) {
    if (!cities.length) return getAllClubs();
    return uniqueSorted(allSlots.filter(s => cities.includes(s.city)).map(s => s.club));
  }

  function getAllDurations() {
    return DURATION_BUCKETS.map(b => b.id);
  }

  function setMultiOptions(el, values, selected, defaultLabel, labelFn, onChange) {
    const box = el.querySelector('.ms-options');
    box.innerHTML = '';
    const allLabel = document.createElement('label');
    const allCb = document.createElement('input');
    allCb.type = 'checkbox';
    allCb.checked = values.length > 0 && values.every(v => selected.includes(v));
    allCb.addEventListener('change', () => onChange(allCb.checked ? [...values] : []));
    allLabel.appendChild(allCb);
    allLabel.appendChild(document.createTextNode('Tout sélectionner'));
    box.appendChild(allLabel);
    values.forEach(v => {
      const label = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = selected.includes(v);
      cb.addEventListener('change', () => {
        const next = cb.checked ? [...selected, v] : selected.filter(x => x !== v);
        onChange(next);
      });
      label.appendChild(cb);
      label.appendChild(document.createTextNode(labelFn(v)));
      box.appendChild(label);
    });
    const isAll = !selected.length || values.every(v => selected.includes(v));
    el.querySelector('summary').textContent = isAll
      ? defaultLabel
      : selected.map(labelFn).join(', ');
  }

  function syncLinkedFilters() {
    const clubOptions = getClubsForCities(state.city);
    state.club = state.club.filter(c => clubOptions.includes(c));

    setMultiOptions(document.getElementById('filter-city'), getAllCities(), state.city,
      'Toutes les villes', String, v => { state.city = v; syncLinkedFilters(); render(); });
    setMultiOptions(document.getElementById('filter-club'), getClubsForCities(state.city), state.club,
      'Tous les clubs', String, v => { state.club = v; syncLinkedFilters(); render(); });
    setMultiOptions(document.getElementById('filter-time'), TIME_BUCKETS.map(b => b.id), state.times,
      'Toutes les heures', id => TIME_BUCKETS.find(b => b.id === id).label, v => { state.times = v; syncLinkedFilters(); render(); });
    setMultiOptions(document.getElementById('filter-duration'), getAllDurations(), state.durations,
      'Toutes les durées', id => DURATION_BUCKETS.find(b => b.id === id).label, v => { state.durations = v; syncLinkedFilters(); render(); });
  }

  function renderDayTabs() {
    const container = document.getElementById('day-tabs');
    container.innerHTML = '';
    days.forEach(key => {
      const btn = document.createElement('button');
      btn.className = 'day-tab' + (key === state.day ? ' active' : '');
      btn.textContent = fmtDayLabel(key);
      btn.onclick = () => { state.day = key; render(); };
      container.appendChild(btn);
    });
  }

  function isBrokenSlot(s) {
    return failedScrapes.has(`${s.club}|${dayKey(s.start)}`);
  }

  function filteredSlotsForDay() {
    return allSlots
      .filter(s => dayKey(s.start) === state.day)
      .filter(s => !isBrokenSlot(s))
      .filter(s => !state.city.length || state.city.includes(s.city))
      .filter(s => !state.club.length || state.club.includes(s.club))
      .filter(s => !state.times.length || TIME_BUCKETS.some(b =>
        state.times.includes(b.id) && b.match(slotHour(s))))
      .filter(s => !state.durations.length || DURATION_BUCKETS.some(b =>
        state.durations.includes(b.id) && b.match(Number(s.durationMinutes))))
      .sort((a, b) => new Date(a.start) - new Date(b.start));
  }

  function render() {
    if (state.view !== 'availabilities') {
      renderClubs();
      return;
    }

    renderDayTabs();
    const slots = filteredSlotsForDay();
    const summary = document.getElementById('summary');
    summary.textContent = slots.length
      ? `${slots.length} créneau${slots.length > 1 ? 'x' : ''} disponible${slots.length > 1 ? 's' : ''}`
      : '';

    const list = document.getElementById('slot-list');
    list.innerHTML = '';

    if (slots.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Aucune disponibilité ne correspond à vos filtres pour ce jour.';
      list.appendChild(empty);
      return;
    }

    slots.forEach(s => {
      const w = weatherFor(s);
      const row = document.createElement('div');
      row.className = 'slot';
      row.innerHTML = `
        <div class="time">${fmtTime(s.start)}<small>${fmtEndTime(s.start, s.durationMinutes)}</small></div>
        <div class="info">
          <div class="club">${s.club}</div>
          <div class="place">${fmtCourtName(s.court)}</div>
        </div>
        ${w ? `<div class="weather"><img src="${w.src}" alt="${w.flag}" title="${w.flag}"></div>` : ''}
        <div class="badge">${fmtDuration(s.durationMinutes)}</div>
      `;
      list.appendChild(row);
    });
  }

  const CLUB_LINKS = {
    'Oasis': {
      web: 'https://oasis-padel.doinsport.club/home',
      ios: 'https://apps.apple.com/gb/app/oasis-padel-club/id6450686703',
      android: 'https://play.google.com/store/apps/details?id=com.trenicom.oasispadelclub',
    },
    'ATC': {
      web: 'https://member-app.deciplus.pro/academietennisclub/calendar/',
    },
    'Bocage': {
      web: 'https://bocagepadelclub.gestion-sports.com/appli/Reservation',
      ios: 'https://apps.apple.com/us/app/bocage-padel-club/id6479243255',
      android: 'https://play.google.com/store/apps/details?id=fr.gestionsports.bocagepadelclub',
    },
    'Padel de Bourbon': {
      web: 'https://padelbourbon.doinsport.club/home',
      ios: 'https://apps.apple.com/mv/app/padel-de-bourbon/id6499515818',
      android: 'https://play.google.com/store/apps/details?id=com.trenicom.padeldebourbon',
    },
    'Champ-Fleuri': {
      web: 'https://champfleuri.gestion-sports.com/appli/Reservation',
      ios: 'https://apps.apple.com/fr/app/tennis-et-padel-champ-fleuri/id6758334018',
      android: 'https://play.google.com/store/apps/details?id=fr.gestionsports.champfleuri',
    },
    'Hangar': {
      web: 'https://hangarpadel.doinsport.club/home',
      ios: 'https://apps.apple.com/us/app/hangar-padel-r%C3%A9union/id1614456493',
      android: 'https://play.google.com/store/apps/details?id=com.trenicom.hangarpadelreunion',
    },
    'RPC': {
      web: 'https://reunionpadelclub.re/login',
    },
    'Sain-Gym': {
      web: 'https://padelpassion.gestion-sports.com/appli/Club',
      ios: 'https://apps.apple.com/us/app/padel-passion/id1601666321',
      android: 'https://play.google.com/store/apps/details?id=fr.gestionsports.padelpassion',
    },
    'TCD': {
      web: 'https://tcdreunion.gestion-sports.com/appli/Reservation',
      ios: 'https://apps.apple.com/to/app/tcd-r%C3%A9union/id6802674065',
      android: 'https://play.google.com/store/apps/details?id=fr.gestionsports.tcdreunion',
    },
    'USPG': {
      web: 'https://courtside.re/terrains',
    },
    'Kaz à Padel': {
      web: 'https://kazapadel.doinsport.club/home',
      ios: 'https://apps.apple.com/fr/app/kaz-a-padel-la-r%C3%A9union/id1567010589',
      android: 'https://play.google.com/store/apps/details?id=com.trenicom.kazapadel',
    },
  };

  function appStoreLinks(links) {
    const ua = navigator.userAgent;
    const isIos = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    const isAndroid = /Android/.test(ua);
    if (isIos) return links.ios ? [{ label: "Télécharger l'appli", href: links.ios }] : [];
    if (isAndroid) return links.android ? [{ label: "Télécharger l'appli", href: links.android }] : [];
    return [
      links.ios && { label: "Télécharger l'appli (iOS)", href: links.ios },
      links.android && { label: "Télécharger l'appli (Android)", href: links.android },
    ].filter(Boolean);
  }

  function renderClubs() {
    const list = document.getElementById('fresh-list');
    const summary = document.getElementById('fresh-summary');
    list.innerHTML = '';

    const clubs = [...new Set([...allSlots.map(s => s.club), ...Object.keys(CLUB_LINKS)])]
      .sort((a, b) => a.localeCompare(b));
    summary.textContent = `${clubs.length} club${clubs.length > 1 ? 's' : ''}`;

    clubs.forEach(club => {
      const links = CLUB_LINKS[club] || {};
      const card = document.createElement('article');
      card.className = 'club-status';

      const name = document.createElement('div');
      name.className = 'club-name';
      const clubCity = (allSlots.find(s => s.club === club) || {}).city;
      name.textContent = clubCity ? `${club} (${clubCity})` : club;
      card.appendChild(name);

      const storeButtons = appStoreLinks(links);
      const buttons = [
        links.web && { label: 'Réserver sur le site', href: links.web, primary: true },
        ...(storeButtons.length ? storeButtons : [{ label: "Pas d'appli mobile", disabled: true }]),
      ].filter(Boolean);

      const actions = document.createElement('div');
      actions.className = 'actions';
      buttons.forEach(b => {
        const el = document.createElement(b.disabled ? 'span' : 'a');
        el.className = 'btn' + (b.primary ? ' primary' : '') + (b.disabled ? ' disabled' : '');
        if (b.disabled) {
          el.setAttribute('aria-disabled', 'true');
        } else {
          el.href = b.href;
          el.target = '_blank';
          el.rel = 'noopener noreferrer';
        }
        el.textContent = b.label;
        actions.appendChild(el);
      });
      card.appendChild(actions);
      list.appendChild(card);
    });
  }

  function setView(view) {
    state.view = view;
    document.getElementById('tab-availabilities').classList.toggle('active', view === 'availabilities');
    document.getElementById('tab-freshness').classList.toggle('active', view === 'freshness');
    document.getElementById('panel-availabilities').classList.toggle('hidden', view !== 'availabilities');
    document.getElementById('panel-freshness').classList.toggle('hidden', view !== 'freshness');
    render();
  }

  function attachFilterHandlers() {
    document.addEventListener('click', e => {
      document.querySelectorAll('.ms[open]').forEach(d => { if (!d.contains(e.target)) d.open = false; });
    });
    document.getElementById('reset').addEventListener('click', () => {
      state.city = []; state.club = []; state.durations = [...DEFAULT_DURATIONS]; state.times = [];
      syncLinkedFilters();
      render();
    });

    document.getElementById('tab-availabilities').addEventListener('click', () => setView('availabilities'));
    document.getElementById('tab-freshness').addEventListener('click', () => setView('freshness'));
  }

  async function init() {
    try {
      const [availabilityRes, scrapeRunsRes, meteoRes] = await Promise.all([
        fetch(DATA_URL, { cache: 'no-store' }),
        fetch(SCRAPE_RUNS_URL, { cache: 'no-store' }).catch(() => null),
        fetch(METEO_URL, { cache: 'no-store' }).catch(() => null),
      ]);
      try {
        const meteoData = meteoRes && meteoRes.ok ? await meteoRes.json() : { meteoRuns: [] };
        buildMeteoIndex(meteoData.meteoRuns || []);
      } catch (e) {
        buildMeteoIndex([]);
      }

      const data = await availabilityRes.json();
      const scrapeData = scrapeRunsRes ? await scrapeRunsRes.json() : { scrapeRuns: [] };

      allSlots = data.availabilities || [];
      scrapeRuns = scrapeData.scrapeRuns || [];
      failedScrapes = new Set(scrapeRuns
        .filter(r => String(r.status).toLowerCase() !== 'success')
        .map(r => `${r.club}|${r.availabilityDate}`));
      days = uniqueSorted(allSlots.map(s => dayKey(s.start)));
      state.day = days[0] || null;

      const generatedAtDates = [data.generatedAt, scrapeData.generatedAt]
        .filter(Boolean)
        .map(value => new Date(value))
        .filter(d => !Number.isNaN(d.getTime()));

      if (generatedAtDates.length) {
        const latestGeneratedAt = new Date(Math.max(...generatedAtDates.map(d => d.getTime())));
        document.getElementById('updated').textContent = fmtUpdatedSubtitle(latestGeneratedAt);
      } else {
        document.getElementById('updated').textContent = '';
      }

      syncLinkedFilters();
      attachFilterHandlers();
      render();
    } catch (err) {
      document.getElementById('slot-list').innerHTML =
        '<div class="empty">Impossible de charger les disponibilités (availabilities.json introuvable ou invalide).</div>';
      console.error(err);
    }
  }

  init();
</script>
