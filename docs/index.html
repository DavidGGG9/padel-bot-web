<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelBot - Disponibilités des terrains à la Réunion</title>
<style>
  :root {
    --bg: #F4F6F5;
    --surface: #FFFFFF;
    --ink: #14201E;
    --muted: #5B6D68;
    --primary: #0E4B44;
    --primary-ink: #FFFFFF;
    --accent: #CFE94A;
    --accent-ink: #33420A;
    --border: #DCE3E0;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.4;
  }
  header {
    background: var(--primary);
    color: var(--primary-ink);
    padding: 20px 16px 24px;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  header .updated {
    margin: 0;
    font-size: 12.5px;
    color: rgba(255,255,255,0.72);
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px 48px;
  }
  .view-tabs {
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: fixed;
    left: 16px;
    top: 96px;
    width: 210px;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    z-index: 5;
  }
  .view-tab {
    width: 100%;
    border: 1px solid var(--border);
    background: #F8FAF9;
    color: var(--muted);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .view-tab.active {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--primary-ink);
  }
  .panel { margin-top: 10px; }
  .panel.hidden { display: none; }
  .filters {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .filters input, .filters select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    color: var(--ink);
    background: var(--surface);
  }
  .filters .search { grid-column: 1 / -1; }
  .filters .reset {
    grid-column: 1 / -1;
    text-align: right;
    font-size: 13px;
    color: var(--primary);
    background: none;
    border: none;
    padding: 4px 0 0;
    cursor: pointer;
    text-decoration: underline;
  }
  .day-tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 16px 0 4px;
    scrollbar-width: none;
  }
  .day-tabs::-webkit-scrollbar { display: none; }
  .day-tab {
    flex: 0 0 auto;
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .day-tab.active {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--primary-ink);
  }
  .summary {
    font-size: 13px;
    color: var(--muted);
    margin: 12px 2px 8px;
  }
  .slot {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .slot .time {
    flex: 0 0 92px;
    font-weight: 700;
    font-size: 14.5px;
    color: var(--primary);
  }
  .slot .time small {
    display: block;
    font-weight: 500;
    color: var(--muted);
    font-size: 11.5px;
  }
  .slot .info { flex: 1; min-width: 0; }
  .slot .club {
    font-weight: 600;
    font-size: 14.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .slot .place {
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .slot .badge {
    flex: 0 0 auto;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 11.5px;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 20px;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 40px 12px;
  }
  .fresh-summary {
    font-size: 13px;
    color: var(--muted);
    margin: 14px 2px 8px;
  }
  .club-status {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .club-status .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .club-status .club-name {
    font-size: 14.5px;
    font-weight: 700;
  }
  .club-status .tick {
    flex: 0 0 auto;
    font-size: 12.5px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid;
  }
  .club-status .tick.ok {
    color: #1B5E20;
    background: #E7F7EA;
    border-color: #B9E2C0;
  }
  .club-status .tick.ko {
    color: #7A1212;
    background: #FBE9E9;
    border-color: #F0B8B8;
  }
  .club-status .latest-date {
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 7px;
  }
  .club-status .bars {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    min-height: 52px;
    overflow-x: auto;
    padding: 6px 1px 2px;
    scrollbar-width: thin;
  }
  .club-status .bar {
    width: 12px;
    height: 40px;
    border-radius: 4px;
    border: 1px solid rgba(0, 0, 0, 0.08);
    flex: 0 0 auto;
  }
  .club-status .bar.ok { background: #3CB371; }
  .club-status .bar.ko { background: #D64545; }
  .club-status .bar.na { background: #D3DBD8; }
  @media (max-width: 480px) {
    .club-status .row { align-items: flex-start; flex-direction: column; }
  }
  @media (max-width: 1024px) {
    .view-tabs {
      position: static;
      width: auto;
      flex-direction: row;
      margin-top: -16px;
    }
    .view-tab { width: auto; flex: 1; }
  }
</style>
</head>
<body>

<header>
  <h1>PadelBot - Disponibilités des terrains à la Réunion</h1>
  <p class="updated" id="updated"></p>
</header>

<main>
  <div class="view-tabs">
    <button class="view-tab active" id="tab-availabilities" type="button">Disponibilités</button>
    <button class="view-tab" id="tab-freshness" type="button">Fraîcheur des données</button>
  </div>

  <section class="panel" id="panel-availabilities">
    <div class="filters">
      <select id="filter-city"><option value="">Toutes les villes</option></select>
      <select id="filter-club"><option value="">Tous les clubs</option></select>
      <select class="search" id="filter-duration-min">
        <option value="0">Durée min: toutes</option>
        <option value="30">Durée min: 30 min</option>
        <option value="60">Durée min: 60 min</option>
        <option value="90">Durée min: 90 min</option>
        <option value="120">Durée min: 120 min</option>
      </select>
      <button class="reset" id="reset">Réinitialiser les filtres</button>
    </div>

    <div class="day-tabs" id="day-tabs"></div>
    <p class="summary" id="summary"></p>
    <div id="slot-list"></div>
  </section>

  <section class="panel hidden" id="panel-freshness">
    <p class="fresh-summary" id="fresh-summary"></p>
    <div id="fresh-list"></div>
  </section>
</main>

<script>
  const DATA_URL = './availabilities.json';
  const SCRAPE_RUNS_URL = './scrape_runs.json';
  let allSlots = [];
  let scrapeRuns = [];
  let days = [];
  let state = { city: '', club: '', durationMin: 0, day: null, view: 'availabilities', lastChangedFilter: null };

  function fmtTime(iso) {
    const d = new Date(iso);
    return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }

  function fmtEndTime(iso, durationMinutes) {
    const d = new Date(new Date(iso).getTime() + durationMinutes * 60000);
    return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }

  function fmtDuration(mins) {
    if (mins % 60 === 0) return (mins / 60) + 'h';
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return h > 0 ? `${h}h${String(m).padStart(2, '0')}` : `${m} min`;
  }

  function fmtCourtName(court) {
    return String(court || '')
      .replace(/\bterrain\b/gi, '')
      .replace(/\s{2,}/g, ' ')
      .trim();
  }

  function dayKey(iso) {
    return new Date(iso).toISOString().slice(0, 10);
  }

  function fmtDayLabel(key) {
    const d = new Date(key + 'T12:00:00');
    const today = new Date();
    const todayKey = today.toISOString().slice(0, 10);
    const tomorrow = new Date(today.getTime() + 86400000).toISOString().slice(0, 10);
    if (key === todayKey) return "Aujourd'hui";
    if (key === tomorrow) return 'Demain';
    return d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
  }

  function uniqueSorted(values) {
    return [...new Set(values)].sort((a, b) => a.localeCompare(b));
  }

  function fmtIsoDate(isoDate) {
    const d = new Date(isoDate + 'T12:00:00');
    return d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
  }

  function fmtUpdatedSubtitle(d) {
    const datePart = d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    const timePart = d.toLocaleTimeString('fr-FR', {
      hour: '2-digit',
      minute: '2-digit',
      hour12: false,
    });
    return `Mis à jour le ${datePart} à ${timePart}`;
  }

  function getNext7DayKeys(baseDate = new Date()) {
    const start = new Date(baseDate);
    start.setHours(12, 0, 0, 0);
    return Array.from({ length: 7 }, (_, i) => {
      const d = new Date(start.getTime() + i * 86400000);
      return d.toISOString().slice(0, 10);
    });
  }

  function getAllCities() {
    return uniqueSorted(allSlots.map(s => s.city));
  }

  function getAllClubs() {
    return uniqueSorted(allSlots.map(s => s.club));
  }

  function getCitiesForClub(club) {
    if (!club) return getAllCities();
    return uniqueSorted(allSlots.filter(s => s.club === club).map(s => s.city));
  }

  function getClubsForCity(city) {
    if (!city) return getAllClubs();
    return uniqueSorted(allSlots.filter(s => s.city === city).map(s => s.club));
  }

  function setSelectOptions(selectEl, values, defaultLabel) {
    const previousValue = selectEl.value;
    selectEl.innerHTML = '';

    const defaultOption = document.createElement('option');
    defaultOption.value = '';
    defaultOption.textContent = defaultLabel;
    selectEl.appendChild(defaultOption);

    values.forEach(v => {
      const o = document.createElement('option');
      o.value = v;
      o.textContent = v;
      selectEl.appendChild(o);
    });

    if (values.includes(previousValue)) {
      selectEl.value = previousValue;
    } else {
      selectEl.value = '';
    }
  }

  function syncLinkedFilters(changedBy = null) {
    if (changedBy) state.lastChangedFilter = changedBy;

    if (state.lastChangedFilter === 'city' && state.city) {
      const clubsForCity = getClubsForCity(state.city);
      if (!clubsForCity.includes(state.club)) state.club = '';
    }

    const cityOptions = getAllCities();
    const clubOptions = state.city ? getClubsForCity(state.city) : getAllClubs();

    if (state.city && !cityOptions.includes(state.city)) {
      state.city = cityOptions[0] || '';
    }
    if (state.club && !clubOptions.includes(state.club)) {
      state.club = '';
    }

    const citySel = document.getElementById('filter-city');
    const clubSel = document.getElementById('filter-club');

    setSelectOptions(citySel, cityOptions, 'Toutes les villes');
    setSelectOptions(clubSel, clubOptions, 'Tous les clubs');

    citySel.value = state.city;
    clubSel.value = state.club;
  }

  function renderDayTabs() {
    const container = document.getElementById('day-tabs');
    container.innerHTML = '';
    days.forEach(key => {
      const btn = document.createElement('button');
      btn.className = 'day-tab' + (key === state.day ? ' active' : '');
      btn.textContent = fmtDayLabel(key);
      btn.onclick = () => { state.day = key; render(); };
      container.appendChild(btn);
    });
  }

  function filteredSlotsForDay() {
    return allSlots
      .filter(s => dayKey(s.start) === state.day)
      .filter(s => !state.city || s.city === state.city)
      .filter(s => !state.club || s.club === state.club)
      .filter(s => Number(s.durationMinutes) >= state.durationMin)
      .sort((a, b) => new Date(a.start) - new Date(b.start));
  }

  function render() {
    if (state.view !== 'availabilities') {
      renderFreshness();
      return;
    }

    renderDayTabs();
    const slots = filteredSlotsForDay();
    const summary = document.getElementById('summary');
    summary.textContent = slots.length
      ? `${slots.length} créneau${slots.length > 1 ? 'x' : ''} disponible${slots.length > 1 ? 's' : ''}`
      : '';

    const list = document.getElementById('slot-list');
    list.innerHTML = '';

    if (slots.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Aucune disponibilité ne correspond à vos filtres pour ce jour.';
      list.appendChild(empty);
      return;
    }

    slots.forEach(s => {
      const row = document.createElement('div');
      row.className = 'slot';
      row.innerHTML = `
        <div class="time">${fmtTime(s.start)}<small>${fmtEndTime(s.start, s.durationMinutes)}</small></div>
        <div class="info">
          <div class="club">${s.club} (${s.city})</div>
          <div class="place">${fmtCourtName(s.court)}</div>
        </div>
        <div class="badge">${fmtDuration(s.durationMinutes)}</div>
      `;
      list.appendChild(row);
    });
  }

  function renderFreshness() {
    const freshList = document.getElementById('fresh-list');
    const summary = document.getElementById('fresh-summary');
    freshList.innerHTML = '';
    const todayKey = new Date().toISOString().slice(0, 10);

    if (!scrapeRuns.length) {
      summary.textContent = '';
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Aucune donnée de fraîcheur disponible (scrape_runs.json introuvable ou vide).';
      freshList.appendChild(empty);
      return;
    }

    const byClub = new Map();
    scrapeRuns.forEach(run => {
      if (!byClub.has(run.club)) byClub.set(run.club, []);
      byClub.get(run.club).push(run);
    });

    const clubs = [...byClub.keys()].sort((a, b) => a.localeCompare(b));
    const next7 = getNext7DayKeys();
    summary.textContent = `${clubs.length} club${clubs.length > 1 ? 's' : ''} suivis`;

    clubs.forEach(club => {
      const runs = byClub.get(club);
      runs.sort((a, b) => {
        if (a.availabilityDate === b.availabilityDate) {
          return new Date(b.scrapedAt) - new Date(a.scrapedAt);
        }
        return a.availabilityDate.localeCompare(b.availabilityDate);
      });

      const visibleRuns = runs.filter(run => run.availabilityDate >= todayKey);
      const latest = visibleRuns[visibleRuns.length - 1];

      const statusByDate = new Map();
      runs.forEach(run => statusByDate.set(run.availabilityDate, String(run.status).toLowerCase()));
      const sevenDaysOk = next7.every(day => statusByDate.get(day) === 'success');

      const card = document.createElement('article');
      card.className = 'club-status';

      const row = document.createElement('div');
      row.className = 'row';

      const name = document.createElement('div');
      name.className = 'club-name';
      name.textContent = club;

      const tick = document.createElement('div');
      tick.className = 'tick ' + (sevenDaysOk ? 'ok' : 'ko');
      tick.textContent = sevenDaysOk ? '✓ 7j OK' : '✕ 7j incomplet';

      row.appendChild(name);
      row.appendChild(tick);

      const date = document.createElement('div');
      date.className = 'latest-date';
      date.textContent = latest
        ? `Dernier jour disponible: ${fmtIsoDate(latest.availabilityDate)}`
        : "Pas de data pour aujourd'hui et après";

      const bars = document.createElement('div');
      bars.className = 'bars';

      visibleRuns.forEach(run => {
        const status = String(run.status || 'unknown').toLowerCase();
        const bar = document.createElement('div');
        bar.className = 'bar ' + (status === 'success' ? 'ok' : (status === 'error' ? 'ko' : 'na'));
        bar.title = `${club} - ${run.availabilityDate} - ${status}`;
        bar.setAttribute('aria-label', `${club} - ${run.availabilityDate} - ${status}`);
        bars.appendChild(bar);
      });

      card.appendChild(row);
      card.appendChild(date);
      card.appendChild(bars);
      freshList.appendChild(card);
    });
  }

  function setView(view) {
    state.view = view;
    document.getElementById('tab-availabilities').classList.toggle('active', view === 'availabilities');
    document.getElementById('tab-freshness').classList.toggle('active', view === 'freshness');
    document.getElementById('panel-availabilities').classList.toggle('hidden', view !== 'availabilities');
    document.getElementById('panel-freshness').classList.toggle('hidden', view !== 'freshness');
    render();
  }

  function attachFilterHandlers() {
    document.getElementById('filter-city').addEventListener('change', e => {
      state.city = e.target.value;
      syncLinkedFilters('city');
      render();
    });
    document.getElementById('filter-club').addEventListener('change', e => {
      state.club = e.target.value;
      syncLinkedFilters('club');
      render();
    });
    document.getElementById('filter-duration-min').addEventListener('change', e => {
      state.durationMin = Number(e.target.value || 0);
      render();
    });
    document.getElementById('reset').addEventListener('click', () => {
      state.city = ''; state.club = ''; state.durationMin = 0; state.lastChangedFilter = null;
      syncLinkedFilters();
      document.getElementById('filter-duration-min').value = '0';
      render();
    });

    document.getElementById('tab-availabilities').addEventListener('click', () => setView('availabilities'));
    document.getElementById('tab-freshness').addEventListener('click', () => setView('freshness'));
  }

  async function init() {
    try {
      const [availabilityRes, scrapeRunsRes] = await Promise.all([
        fetch(DATA_URL, { cache: 'no-store' }),
        fetch(SCRAPE_RUNS_URL, { cache: 'no-store' }).catch(() => null),
      ]);

      const data = await availabilityRes.json();
      const scrapeData = scrapeRunsRes ? await scrapeRunsRes.json() : { scrapeRuns: [] };

      allSlots = data.availabilities || [];
      scrapeRuns = scrapeData.scrapeRuns || [];
      days = uniqueSorted(allSlots.map(s => dayKey(s.start)));
      state.day = days[0] || null;

      const generatedAtDates = [data.generatedAt, scrapeData.generatedAt]
        .filter(Boolean)
        .map(value => new Date(value))
        .filter(d => !Number.isNaN(d.getTime()));

      if (generatedAtDates.length) {
        const latestGeneratedAt = new Date(Math.max(...generatedAtDates.map(d => d.getTime())));
        document.getElementById('updated').textContent = fmtUpdatedSubtitle(latestGeneratedAt);
      } else {
        document.getElementById('updated').textContent = '';
      }

      syncLinkedFilters();
      attachFilterHandlers();
      render();
    } catch (err) {
      document.getElementById('slot-list').innerHTML =
        '<div class="empty">Impossible de charger les disponibilités (availabilities.json introuvable ou invalide).</div>';
      console.error(err);
    }
  }

  init();
</script>

</body>
</html>
