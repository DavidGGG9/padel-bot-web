<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelBot - Disponibilités des terrains à la Réunion</title>
<style>
  :root {
    --bg: #F4F6F5;
    --surface: #FFFFFF;
    --ink: #14201E;
    --muted: #5B6D68;
    --primary: #0E4B44;
    --primary-ink: #FFFFFF;
    --accent: #CFE94A;
    --accent-ink: #33420A;
    --border: #DCE3E0;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.4;
  }
  header {
    position: relative;
    background: var(--primary);
    color: var(--primary-ink);
    padding: 20px 16px 44px;
  }
  .beta-badge {
    position: absolute;
    bottom: 12px;
    right: 16px;
    display: flex;
    flex-direction: row;
    align-items: baseline;
    gap: 6px;
    text-align: right;
    font-size: 11px;
    line-height: 1.2;
    color: rgba(255,255,255,0.82);
  }
  .beta-badge strong {
    color: var(--accent);
    font-size: 12px;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  header .updated {
    margin: 0;
    font-size: 13.5px;
    color: rgba(255,255,255,0.72);
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px 48px;
  }
  .view-tabs {
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: fixed;
    left: 16px;
    top: 96px;
    width: 210px;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    z-index: 5;
  }
  .view-tab {
    width: 100%;
    border: 1px solid var(--border);
    background: #F8FAF9;
    color: var(--muted);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .view-tab.active {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--primary-ink);
  }
  .panel { margin-top: 10px; }
  .panel.hidden { display: none; }
  .filters {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .filters input, .filters select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    color: var(--ink);
    background: var(--surface);
  }
  .filters .search { grid-column: 1 / -1; }
  .ms { position: relative; }
  .ms summary {
    list-style: none;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: var(--surface);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ms summary::-webkit-details-marker { display: none; }
  .ms-options {
    position: absolute;
    left: 0; right: 0;
    top: calc(100% + 4px);
    max-height: 260px;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
    z-index: 10;
  }
  .ms-options label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    font-size: 14px;
    cursor: pointer;
  }
  .ms-options input { width: auto; }
  .filters .reset {
    grid-column: 1 / -1;
    text-align: right;
    font-size: 13px;
    color: var(--primary);
    background: none;
    border: none;
    padding: 4px 0 0;
    cursor: pointer;
    text-decoration: underline;
  }
  .day-tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 16px 0 4px;
    scrollbar-width: none;
  }
  .day-tabs::-webkit-scrollbar { display: none; }
  .day-tab {
    flex: 0 0 auto;
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .day-tab.active {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--primary-ink);
  }
  .summary {
    font-size: 13px;
    color: var(--muted);
    margin: 12px 2px 8px;
  }
  .slot {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .slot .time {
    flex: 0 0 92px;
    font-weight: 700;
    font-size: 14.5px;
    color: var(--primary);
  }
  .slot .time small {
    display: block;
    font-weight: 500;
    color: var(--muted);
    font-size: 11.5px;
  }
  .slot .info { flex: 1; min-width: 0; }
  .slot .club {
    font-weight: 600;
    font-size: 14.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .slot .place {
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .slot .badge {
    flex: 0 0 auto;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 11.5px;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 20px;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 40px 12px;
  }
  footer {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px 32px;
    text-align: center;
    font-size: 12.5px;
  }
  footer a { color: var(--muted); }
  .fresh-summary {
    font-size: 13px;
    color: var(--muted);
    margin: 14px 2px 8px;
  }
  .club-status {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .club-status .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .club-status .club-name {
    font-size: 14.5px;
    font-weight: 700;
  }
  .club-status .tick {
    flex: 0 0 auto;
    font-size: 12.5px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid;
  }
  .club-status .tick.ok {
    color: #1B5E20;
    background: #E7F7EA;
    border-color: #B9E2C0;
  }
  .club-status .tick.ko {
    color: #7A1212;
    background: #FBE9E9;
    border-color: #F0B8B8;
  }
  .club-status .latest-date {
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 7px;
  }
  .club-status .bars {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    overflow-x: auto;
    padding: 6px 1px 2px;
    scrollbar-width: thin;
  }
  .club-status .day {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex: 0 0 auto;
    width: 30px;
  }
  .club-status .day-label {
    font-size: 10.5px;
    line-height: 1.15;
    color: var(--muted);
    text-align: center;
  }
  .club-status .day-label b {
    display: block;
    font-size: 12px;
    color: var(--ink);
  }
  .club-status .bar {
    width: 100%;
    height: 28px;
    border-radius: 6px;
    border: 1px solid rgba(0, 0, 0, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
  }
  .club-status .bar.ok { background: #3CB371; }
  .club-status .bar.ko { background: #D64545; }
  .club-status .bar.na { background: #D3DBD8; }
  @media (max-width: 480px) {
    .club-status .row { align-items: flex-start; flex-direction: column; }
  }
  @media (max-width: 1024px) {
    .view-tabs {
      position: static;
      width: auto;
      flex-direction: row;
      margin-top: 16px;
    }
    .view-tab { width: auto; flex: 1; }
  }
</style>
</head>
<body>

<header>
  <h1>PadelBot - Trouvez un terrain à la Réunion</h1>
  <p class="updated" id="updated"></p>
  <div class="beta-badge" aria-label="Version 0.1 Beta, en cours de test">
    <strong>Version 0.1 (Beta)</strong>
    <span>en cours de test</span>
  </div>
</header>

<main>
  <div class="view-tabs">
    <button class="view-tab active" id="tab-availabilities" type="button">Disponibilités</button>
    <button class="view-tab" id="tab-freshness" type="button">Les clubs</button>
  </div>

  <section class="panel" id="panel-availabilities">
    <div class="filters">
      <details class="ms" id="filter-city"><summary>Toutes les villes</summary><div class="ms-options"></div></details>
      <details class="ms" id="filter-club"><summary>Tous les clubs</summary><div class="ms-options"></div></details>
      <details class="ms search" id="filter-duration"><summary>Toutes les durées</summary><div class="ms-options"></div></details>
      <button class="reset" id="reset">Réinitialiser les filtres</button>
    </div>

    <div class="day-tabs" id="day-tabs"></div>
    <p class="summary" id="summary"></p>
    <div id="slot-list"></div>
  </section>

  <section class="panel hidden" id="panel-freshness">
    <p class="fresh-summary" id="fresh-summary"></p>
    <div id="fresh-list"></div>
  </section>
</main>

<footer>
  <a href="./mentions-legales.html">Mentions légales</a>
</footer>

<script>
  const DATA_URL = './availabilities.json';
  const SCRAPE_RUNS_URL = './scrape_runs.json';
  const REUNION_TIME_ZONE = 'Indian/Reunion';
  const reunionDateFormatter = new Intl.DateTimeFormat('en-CA', {
    timeZone: REUNION_TIME_ZONE,
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
  });
  let allSlots = [];
  let scrapeRuns = [];
  let days = [];
  const DURATION_BUCKETS = [
    { id: '30', label: '30 min', match: d => d === 30 },
    { id: '60', label: '1h et +', match: d => d >= 60 },
    { id: '120', label: '2h et +', match: d => d >= 120 },
  ];
  const DEFAULT_DURATIONS = ['60', '120'];
  let state = { city: [], club: [], durations: [...DEFAULT_DURATIONS], day: null, view: 'availabilities' };

  function fmtTime(iso) {
    const d = new Date(iso);
    return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }

  function fmtEndTime(iso, durationMinutes) {
    const d = new Date(new Date(iso).getTime() + durationMinutes * 60000);
    return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }

  function fmtDuration(mins) {
    if (mins % 60 === 0) return (mins / 60) + 'h';
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return h > 0 ? `${h}h${String(m).padStart(2, '0')}` : `${m} min`;
  }

  function fmtCourtName(court) {
    return String(court || '')
      .replace(/\bterrain\b/gi, '')
      .replace(/\s{2,}/g, ' ')
      .trim();
  }

  function dayKey(iso) {
    return new Date(iso).toISOString().slice(0, 10);
  }

  function fmtDayLabel(key) {
    const d = new Date(key + 'T12:00:00');
    const today = new Date();
    const todayKey = today.toISOString().slice(0, 10);
    const tomorrow = new Date(today.getTime() + 86400000).toISOString().slice(0, 10);
    if (key === todayKey) return "Aujourd'hui";
    if (key === tomorrow) return 'Demain';
    return d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
  }

  function uniqueSorted(values) {
    return [...new Set(values)].sort((a, b) => a.localeCompare(b));
  }

  function fmtIsoDate(isoDate) {
    const d = new Date(isoDate + 'T12:00:00');
    return d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
  }

  function reunionDateKey(date = new Date()) {
    return reunionDateFormatter.format(date);
  }

  function fmtUpdatedSubtitle(d) {
    const datePart = d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    const timePart = d.toLocaleTimeString('fr-FR', {
      hour: '2-digit',
      minute: '2-digit',
      hour12: false,
    });
    return `Mis à jour le ${datePart} à ${timePart}`;
  }

  function getNext10DayKeys(baseDate = new Date()) {
    const [year, month, day] = reunionDateKey(baseDate).split('-').map(Number);
    const start = new Date(Date.UTC(year, month - 1, day, 12));
    return Array.from({ length: 10 }, (_, i) => {
      const d = new Date(start.getTime() + i * 86400000);
      return d.toISOString().slice(0, 10);
    });
  }

  function getAllCities() {
    return uniqueSorted(allSlots.map(s => s.city));
  }

  function getAllClubs() {
    return uniqueSorted(allSlots.map(s => s.club));
  }

  function getClubsForCities(cities) {
    if (!cities.length) return getAllClubs();
    return uniqueSorted(allSlots.filter(s => cities.includes(s.city)).map(s => s.club));
  }

  function getAllDurations() {
    return DURATION_BUCKETS.map(b => b.id);
  }

  function setMultiOptions(el, values, selected, defaultLabel, labelFn, onChange) {
    const box = el.querySelector('.ms-options');
    box.innerHTML = '';
    const allLabel = document.createElement('label');
    const allCb = document.createElement('input');
    allCb.type = 'checkbox';
    allCb.checked = values.length > 0 && values.every(v => selected.includes(v));
    allCb.addEventListener('change', () => onChange(allCb.checked ? [...values] : []));
    allLabel.appendChild(allCb);
    allLabel.appendChild(document.createTextNode('Tout sélectionner'));
    box.appendChild(allLabel);
    values.forEach(v => {
      const label = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = selected.includes(v);
      cb.addEventListener('change', () => {
        const next = cb.checked ? [...selected, v] : selected.filter(x => x !== v);
        onChange(next);
      });
      label.appendChild(cb);
      label.appendChild(document.createTextNode(labelFn(v)));
      box.appendChild(label);
    });
    const isAll = !selected.length || values.every(v => selected.includes(v));
    el.querySelector('summary').textContent = isAll
      ? defaultLabel
      : selected.map(labelFn).join(', ');
  }

  function syncLinkedFilters() {
    const clubOptions = getClubsForCities(state.city);
    state.club = state.club.filter(c => clubOptions.includes(c));

    setMultiOptions(document.getElementById('filter-city'), getAllCities(), state.city,
      'Toutes les villes', String, v => { state.city = v; syncLinkedFilters(); render(); });
    setMultiOptions(document.getElementById('filter-club'), getClubsForCities(state.city), state.club,
      'Tous les clubs', String, v => { state.club = v; syncLinkedFilters(); render(); });
    setMultiOptions(document.getElementById('filter-duration'), getAllDurations(), state.durations,
      'Toutes les durées', id => DURATION_BUCKETS.find(b => b.id === id).label, v => { state.durations = v; syncLinkedFilters(); render(); });
  }

  function renderDayTabs() {
    const container = document.getElementById('day-tabs');
    container.innerHTML = '';
    days.forEach(key => {
      const btn = document.createElement('button');
      btn.className = 'day-tab' + (key === state.day ? ' active' : '');
      btn.textContent = fmtDayLabel(key);
      btn.onclick = () => { state.day = key; render(); };
      container.appendChild(btn);
    });
  }

  function filteredSlotsForDay() {
    return allSlots
      .filter(s => dayKey(s.start) === state.day)
      .filter(s => !state.city.length || state.city.includes(s.city))
      .filter(s => !state.club.length || state.club.includes(s.club))
      .filter(s => !state.durations.length || DURATION_BUCKETS.some(b =>
        state.durations.includes(b.id) && b.match(Number(s.durationMinutes))))
      .sort((a, b) => new Date(a.start) - new Date(b.start));
  }

  function render() {
    if (state.view !== 'availabilities') {
      renderFreshness();
      return;
    }

    renderDayTabs();
    const slots = filteredSlotsForDay();
    const summary = document.getElementById('summary');
    summary.textContent = slots.length
      ? `${slots.length} créneau${slots.length > 1 ? 'x' : ''} disponible${slots.length > 1 ? 's' : ''}`
      : '';

    const list = document.getElementById('slot-list');
    list.innerHTML = '';

    if (slots.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Aucune disponibilité ne correspond à vos filtres pour ce jour.';
      list.appendChild(empty);
      return;
    }

    slots.forEach(s => {
      const row = document.createElement('div');
      row.className = 'slot';
      row.innerHTML = `
        <div class="time">${fmtTime(s.start)}<small>${fmtEndTime(s.start, s.durationMinutes)}</small></div>
        <div class="info">
          <div class="club">${s.club}</div>
          <div class="place">${fmtCourtName(s.court)}</div>
        </div>
        <div class="badge">${fmtDuration(s.durationMinutes)}</div>
      `;
      list.appendChild(row);
    });
  }

  function renderFreshness() {
    const freshList = document.getElementById('fresh-list');
    const summary = document.getElementById('fresh-summary');
    freshList.innerHTML = '';
    const todayKey = reunionDateKey();

    if (!scrapeRuns.length) {
      summary.textContent = '';
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Aucune donnée de fraîcheur disponible (scrape_runs.json introuvable ou vide).';
      freshList.appendChild(empty);
      return;
    }

    const byClub = new Map();
    scrapeRuns.forEach(run => {
      if (!byClub.has(run.club)) byClub.set(run.club, []);
      byClub.get(run.club).push(run);
    });

    const clubs = [...byClub.keys()].sort((a, b) => a.localeCompare(b));
    const next10 = getNext10DayKeys();
    summary.textContent = `${clubs.length} club${clubs.length > 1 ? 's' : ''} suivis`;

    clubs.forEach(club => {
      const runs = byClub.get(club);
      runs.sort((a, b) => {
        if (a.availabilityDate === b.availabilityDate) {
          return new Date(b.scrapedAt) - new Date(a.scrapedAt);
        }
        return a.availabilityDate.localeCompare(b.availabilityDate);
      });

      const visibleRuns = runs.filter(run => run.availabilityDate >= todayKey);
      const latest = visibleRuns.filter(run => String(run.status).toLowerCase() === 'success').pop();

      const statusByDate = new Map();
      runs.forEach(run => statusByDate.set(run.availabilityDate, String(run.status).toLowerCase()));
      const tenDaysOk = next10.every(day => statusByDate.get(day) === 'success');

      const card = document.createElement('article');
      card.className = 'club-status';

      const row = document.createElement('div');
      row.className = 'row';

      const name = document.createElement('div');
      name.className = 'club-name';
      const clubCity = (allSlots.find(s => s.club === club) || {}).city;
      name.textContent = clubCity ? `${club} (${clubCity})` : club;

      const tick = document.createElement('div');
      tick.className = 'tick ' + (tenDaysOk ? 'ok' : 'ko');
      tick.textContent = tenDaysOk ? '✓ Données à jour' : '⚠️ Données manquantes';

      row.appendChild(name);
      row.appendChild(tick);

      const date = document.createElement('div');
      date.className = 'latest-date';
      date.textContent = latest
        ? `Dernier jour disponible: ${fmtIsoDate(latest.availabilityDate)}`
        : "En cours de réparation";

      const bars = document.createElement('div');
      bars.className = 'bars';

      visibleRuns.forEach(run => {
        const status = String(run.status || 'unknown').toLowerCase();
        const bar = document.createElement('div');
        bar.className = 'bar ' + (status === 'success' ? 'ok' : (status === 'error' ? 'ko' : 'na'));
        bar.textContent = status === 'success' ? '✓' : (status === 'error' ? '✕' : '?');
        const d = new Date(run.availabilityDate + 'T12:00:00');
        const label = document.createElement('div');
        label.className = 'day-label';
        label.innerHTML = `${d.toLocaleDateString('fr-FR', { weekday: 'short' }).replace('.', '')}<b>${d.getDate()}</b>`;
        const day = document.createElement('div');
        day.className = 'day';
        day.title = `${club} - ${run.availabilityDate} - ${status}`;
        day.setAttribute('aria-label', `${club} - ${run.availabilityDate} - ${status}`);
        day.appendChild(bar);
        day.appendChild(label);
        bars.appendChild(day);
      });

      card.appendChild(row);
      card.appendChild(date);
      card.appendChild(bars);
      freshList.appendChild(card);
    });
  }

  function setView(view) {
    state.view = view;
    document.getElementById('tab-availabilities').classList.toggle('active', view === 'availabilities');
    document.getElementById('tab-freshness').classList.toggle('active', view === 'freshness');
    document.getElementById('panel-availabilities').classList.toggle('hidden', view !== 'availabilities');
    document.getElementById('panel-freshness').classList.toggle('hidden', view !== 'freshness');
    render();
  }

  function attachFilterHandlers() {
    document.addEventListener('click', e => {
      document.querySelectorAll('.ms[open]').forEach(d => { if (!d.contains(e.target)) d.open = false; });
    });
    document.getElementById('reset').addEventListener('click', () => {
      state.city = []; state.club = []; state.durations = [...DEFAULT_DURATIONS];
      syncLinkedFilters();
      render();
    });

    document.getElementById('tab-availabilities').addEventListener('click', () => setView('availabilities'));
    document.getElementById('tab-freshness').addEventListener('click', () => setView('freshness'));
  }

  async function init() {
    try {
      const [availabilityRes, scrapeRunsRes] = await Promise.all([
        fetch(DATA_URL, { cache: 'no-store' }),
        fetch(SCRAPE_RUNS_URL, { cache: 'no-store' }).catch(() => null),
      ]);

      const data = await availabilityRes.json();
      const scrapeData = scrapeRunsRes ? await scrapeRunsRes.json() : { scrapeRuns: [] };

      allSlots = data.availabilities || [];
      scrapeRuns = scrapeData.scrapeRuns || [];
      days = uniqueSorted(allSlots.map(s => dayKey(s.start)));
      state.day = days[0] || null;

      const generatedAtDates = [data.generatedAt, scrapeData.generatedAt]
        .filter(Boolean)
        .map(value => new Date(value))
        .filter(d => !Number.isNaN(d.getTime()));

      if (generatedAtDates.length) {
        const latestGeneratedAt = new Date(Math.max(...generatedAtDates.map(d => d.getTime())));
        document.getElementById('updated').textContent = fmtUpdatedSubtitle(latestGeneratedAt);
      } else {
        document.getElementById('updated').textContent = '';
      }

      syncLinkedFilters();
      attachFilterHandlers();
      render();
    } catch (err) {
      document.getElementById('slot-list').innerHTML =
        '<div class="empty">Impossible de charger les disponibilités (availabilities.json introuvable ou invalide).</div>';
      console.error(err);
    }
  }

  init();
</script>

</body>
</html>
